<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truck Weight Calculator</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2ef0b8">

</head>
<body>

<div class="container">

<header>

<h1>🚛 Truck Weight Calculator</h1>

<button id="installBtn" class="install-btn">
📲 Install App
</button>

</header>

<div class="tabs">

<button class="tab active" onclick="showMode('split')">
Split Mode
</button>

<button class="tab" onclick="showMode('cat')">
CAT Scale
</button>

<button class="tab" onclick="showMode('reverse')">
Reverse CAT
</button>

</div>

<div class="status">
🟢 Auto Calculating
</div>

<!-- SPLIT MODE -->

<div id="splitMode" class="card">

<h2>Split Mode</h2>

<input id="splitSteer" placeholder="Steer">
<input id="splitSD" placeholder="Steer + Drive">
<input id="splitTandem" placeholder="Tandem">

</div>

<!-- CAT -->

<div id="catMode" class="card hidden">

<h2>CAT Scale</h2>

<input id="catSteer" placeholder="Steer">
<input id="catDrive" placeholder="Drive">
<input id="catTandem" placeholder="Tandem">

</div>

<!-- REVERSE -->

<div id="reverseMode" class="card hidden">

<h2>Reverse CAT</h2>

<input id="revSteer" placeholder="Steer">
<input id="revSD" placeholder="Steer + Drive">
<input id="revGross" placeholder="Gross">

</div>

<div class="results">

<div class="metric">

<div class="metric-title">
Drive Axle
</div>

<div id="driveResult" class="metric-value">
0
</div>

</div>

<div class="metric">

<div class="metric-title">
Gross Weight
</div>

<div id="grossResult" class="metric-value purple">
0
</div>

</div>

</div>

<div class="remaining">

Remaining Capacity

<span id="remaining">
80,000
</span>

lbs

</div>

<div class="card">

<h2>Legal Check</h2>

<div id="legalResults"></div>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
