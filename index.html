<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Truck Weight Calculator</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f172a">
</head>

<body>

<div class="app">

<header>

<div class="logo">
🚛 Truck Weight Calculator
</div>

<div class="tabs">
<button class="tab active">Split Mode</button>
<button class="tab">CAT Scale</button>
</div>

</header>

<div class="status">
🟢 Auto Calculating
</div>

<div class="card input-card">

<div class="field">
<label>Steer</label>
<input id="steer" type="number" placeholder="11600">
</div>

<div class="field">
<label>Steer + Drive</label>
<input id="steerDrive" type="number" placeholder="44780">
</div>

<div class="field">
<label>Tandem</label>
<input id="tandem" type="number" placeholder="33920">
</div>

</div>

<div class="results-grid">

<div class="metric-card">
<div class="title">Drive Axle</div>
<div id="driveResult" class="metric-value">0</div>
</div>

<div class="metric-card gross">
<div class="title">Gross Weight</div>
<div id="grossResult" class="metric-value">0</div>
</div>

</div>

<div class="legal-card">

<h2>Legal Check</h2>

<div id="legalResults"></div>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
