<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Weight Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:#fff;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#00b894;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00a383;
}

.result{
    margin-top:15px;
    line-height:1.8;
    font-size:18px;
}

.good{
    color:#00ff88;
}

.bad{
    color:#ff5252;
}

.mode{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.mode button{
    margin-top:0;
}
</style>
</head>
<body>

<div class="container">

<h1>🚛 Truck Weight Calculator</h1>

<div class="mode">
<button onclick="showCat()">CAT Scale</button>
<button onclick="showSplit()">Split Weight</button>
</div>

<div class="card" id="catMode">

<h2>CAT Scale Mode</h2>

<label>Steer</label>
<input type="number" id="catSteer">

<label>Steer + Drive</label>
<input type="number" id="catSD">

<label>Gross Weight</label>
<input type="number" id="catGross">

<button onclick="calculateCat()">
Calculate
</button>

<div class="result" id="catResults"></div>

</div>

<div class="card" id="splitMode" style="display:none">

<h2>Split Weight Mode</h2>

<label>Steer</label>
<input type="number" id="splitSteer">

<label>Steer + Drive</label>
<input type="number" id="splitSD">

<label>Tandem</label>
<input type="number" id="splitTandem">

<button onclick="calculateSplit()">
Calculate
</button>

<div class="result" id="splitResults"></div>

</div>

</div>

<script>

function showCat(){
    document.getElementById('catMode').style.display='block';
    document.getElementById('splitMode').style.display='none';
}

function showSplit(){
    document.getElementById('catMode').style.display='none';
    document.getElementById('splitMode').style.display='block';
}

function legal(weight, limit){
    if(weight <= limit){
        return `<span class="good">✅ ${weight.toLocaleString()} / ${limit.toLocaleString()}</span>`;
    }
    return `<span class="bad">⚠️ ${weight.toLocaleString()} / ${limit.toLocaleString()} (+${(weight-limit).toLocaleString()})</span>`;
}

function calculateCat(){

    let steer = Number(document.getElementById('catSteer').value);
    let sd = Number(document.getElementById('catSD').value);
    let gross = Number(document.getElementById('catGross').value);

    let drive = sd - steer;
    let tandem = gross - sd;

    document.getElementById('catResults').innerHTML = `
    <hr><br>

    Drive Axle: ${drive.toLocaleString()}<br>
    Tandem Axles: ${tandem.toLocaleString()}<br>
    Gross Weight: ${gross.toLocaleString()}<br><br>

    <b>Legal Check</b><br>

    Steer: ${legal(steer,12000)}<br>
    Drive: ${legal(drive,34000)}<br>
    Tandem: ${legal(tandem,34000)}<br>
    Gross: ${legal(gross,80000)}
    `;
}

function calculateSplit(){

    let steer = Number(document.getElementById('splitSteer').value);
    let sd = Number(document.getElementById('splitSD').value);
    let tandem = Number(document.getElementById('splitTandem').value);

    let drive = sd - steer;
    let gross = steer + drive + tandem;

    document.getElementById('splitResults').innerHTML = `
    <hr><br>

    Drive Axle: ${drive.toLocaleString()}<br>
    Gross Weight: ${gross.toLocaleString()}<br><br>

    <b>Legal Check</b><br>

    Steer: ${legal(steer,12000)}<br>
    Drive: ${legal(drive,34000)}<br>
    Tandem: ${legal(tandem,34000)}<br>
    Gross: ${legal(gross,80000)}
    `;
}

</script>

</body>
</html>
